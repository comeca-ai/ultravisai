# Ultravis addition — atualizações automáticas de dependências (nativo GitHub).
# Complementa a auditoria diária: o Dependabot abre PRs quando sai patch de
# segurança; a CI valida; a gente mergeia. Semanal pra não virar ruído.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['auditoria', 'dependencias']

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['auditoria', 'dependencias']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['auditoria', 'dependencias']
