<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO — como fazer as IAs citarem a sua marca · um curso do Joio do Trigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: oklch(0.965 0.012 88);
    --paper2: oklch(0.985 0.008 90);
    --paper3: oklch(0.935 0.016 88);
    --ink: oklch(0.245 0.02 70);
    --ink2: oklch(0.42 0.02 70);
    --ink3: oklch(0.56 0.018 75);
    --trigo: oklch(0.8 0.13 88);
    --trigo-deep: oklch(0.52 0.11 78);
    --trigo-soft: oklch(0.8 0.13 88 / 0.18);
    --trigo-ink: oklch(0.28 0.06 78);
    --border: oklch(0.87 0.015 85);
    --border2: oklch(0.8 0.02 85);
    --serif:"Newsreader", Georgia, serif;
    --sans:"Inter", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--trigo); color:var(--trigo-ink); }

  .app{ display:grid; grid-template-columns:288px 1fr; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .side{ border-right:1px solid var(--border); background:var(--paper2); padding:30px 22px 26px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; }
  .side .kicker{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--trigo-deep); }
  .side h1{ font-family:var(--serif); font-weight:500; font-size:25px; line-height:1.12; letter-spacing:-0.01em; margin:9px 0 4px; }
  .side h1 em{ font-style:italic; color:var(--trigo-deep); }
  .side .by{ font-size:12px; color:var(--ink3); margin-bottom:20px; }
  #nav{ display:flex; flex-direction:column; gap:2px; }
  #nav button{ display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:baseline; text-align:left; background:none; border:none; border-left:2px solid transparent; font-family:var(--sans); font-size:13px; color:var(--ink2); padding:7.5px 10px 7.5px 12px; cursor:pointer; border-radius:0 7px 7px 0; line-height:1.3; }
  #nav button .n{ font-family:var(--mono); font-size:10px; color:var(--ink3); }
  #nav button .mini{ font-family:var(--mono); font-size:9px; color:var(--ink3); }
  #nav button:hover{ background:var(--paper3); color:var(--ink); }
  #nav button.on{ background:var(--paper3); border-left-color:var(--trigo-deep); color:var(--ink); font-weight:600; }
  #nav button.done .n{ color:var(--trigo-deep); font-weight:700; }
  .side .prog{ margin-top:auto; padding-top:20px; }
  .prog .pl{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:7px; }
  .prog .pl b{ color:var(--trigo-deep); }
  .pbar{ height:5px; border-radius:99px; background:var(--paper3); overflow:hidden; border:1px solid var(--border); }
  .pbar i{ display:block; height:100%; width:0%; background:var(--trigo); border-radius:99px; transition:width .35s ease; }
  .side .foot-note{ font-size:10.5px; color:var(--ink3); line-height:1.55; margin-top:14px; }

  /* ---------- main ---------- */
  main{ padding:52px 58px 90px; max-width:860px; }
  section{ display:none; }
  section.on{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(5px);} to{ opacity:1; transform:none;} }

  .aula-kicker{ display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--trigo-deep); }
  .aula-kicker .etapa{ border:1px solid var(--trigo-deep); border-radius:4px; padding:1.5px 7px; }
  h2.title{ font-family:var(--serif); font-weight:500; font-size:clamp(30px,4.2vw,42px); line-height:1.06; letter-spacing:-0.015em; margin:12px 0 20px; max-width:22ch; }
  h2.title em{ font-style:italic; color:var(--trigo-deep); }

  .lead{ font-family:var(--serif); font-size:19px; line-height:1.55; color:var(--ink); max-width:60ch; }
  .lead p{ margin-bottom:12px; }
  .lead p:first-child::first-letter{ font-size:52px; line-height:0.85; float:left; padding:6px 10px 0 0; color:var(--trigo-deep); font-weight:500; }

  .body{ margin-top:10px; max-width:62ch; }
  .body p{ margin-bottom:13px; color:var(--ink2); }
  .body p b, .body li b{ color:var(--ink); font-weight:600; }
  .body h3{ font-family:var(--serif); font-size:20px; font-weight:560; letter-spacing:-0.008em; margin:26px 0 10px; color:var(--ink); }
  .body ol, .body ul{ margin:0 0 14px 20px; color:var(--ink2); }
  .body li{ margin-bottom:8px; }
  .marker{ display:flex; align-items:center; gap:14px; margin:28px 0 22px; }
  .marker::before, .marker::after{ content:''; height:1px; background:var(--border2); flex:1; }
  .marker span{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--trigo-deep); }

  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; }
  .duo .col{ border:1px solid var(--border); border-radius:11px; background:var(--paper2); padding:16px 17px; }
  .duo .col.win{ border-color:var(--trigo-deep); }
  .duo .col .tag{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:9px; display:block; }
  .duo .col.win .tag{ color:var(--trigo-deep); }
  .duo .col.lose .tag{ color:var(--ink3); }
  .duo .col ul{ list-style:none; margin:0; }
  .duo .col li{ font-size:13px; color:var(--ink2); line-height:1.5; padding-left:16px; position:relative; margin-bottom:7px; }
  .duo .col.win li::before{ content:'+'; position:absolute; left:0; font-family:var(--mono); font-weight:700; color:var(--trigo-deep); }
  .duo .col.lose li::before{ content:'–'; position:absolute; left:0; font-family:var(--mono); font-weight:700; color:var(--ink3); }
  .duo .col li b{ color:var(--ink); }

  .freio{ border:1px dashed var(--border2); border-radius:11px; padding:16px 18px; margin:22px 0; background:var(--paper2); max-width:62ch; }
  .freio .fl{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink3); display:block; margin-bottom:6px; }
  .freio p{ font-size:13.5px; color:var(--ink2); line-height:1.6; }

  .segunda{ border-radius:12px; padding:18px 20px; margin:22px 0; background:var(--trigo-soft); border:1px solid var(--trigo); max-width:62ch; }
  .segunda .sl{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--trigo-ink); display:block; margin-bottom:7px; }
  .segunda p{ font-size:14px; color:var(--ink); line-height:1.6; }
  .segunda p b{ font-weight:700; }
  .segunda .metr{ display:block; margin-top:8px; font-family:var(--mono); font-size:10.5px; color:var(--trigo-ink); }

  .fonte{ font-family:var(--mono); font-size:10px; letter-spacing:0.04em; color:var(--ink3); margin:6px 0 0; }
  .fonte::before{ content:'⌁ '; color:var(--trigo-deep); }

  /* checkpoint */
  .quiz{ border:1px solid var(--trigo-deep); border-radius:13px; background:var(--paper2); padding:20px 22px; margin:30px 0 8px; max-width:62ch; }
  .quiz > .qk{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--trigo-deep); }
  .quiz > .qs-score{ float:right; font-family:var(--mono); font-size:10.5px; color:var(--ink3); }
  .qq{ margin-top:16px; }
  .qq p.qt{ font-size:14.5px; font-weight:600; letter-spacing:-0.005em; margin-bottom:9px; color:var(--ink); }
  .qq .opt{ display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--border2); border-radius:9px; color:var(--ink2); font-family:var(--sans); font-size:13.5px; padding:9px 13px; margin-bottom:6px; cursor:pointer; line-height:1.45; }
  .qq .opt:hover{ border-color:var(--ink3); color:var(--ink); }
  .qq.answered .opt{ cursor:default; opacity:0.7; }
  .qq .opt.correct{ border-color:var(--trigo-deep); background:var(--trigo-soft); color:var(--ink); opacity:1; font-weight:600; }
  .qq .opt.wrong{ border-color:oklch(0.55 0.16 28); color:oklch(0.48 0.14 28); opacity:1; }
  .qq .why{ display:none; font-size:13px; color:var(--ink2); line-height:1.55; border-left:2px solid var(--trigo-deep); padding:4px 0 4px 12px; margin-top:8px; }
  .qq.answered .why{ display:block; }
  .qq .why b{ color:var(--trigo-deep); font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; margin-right:6px; }

  .concluir{ margin-top:18px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; border:1.5px solid var(--trigo-deep); border-radius:9px; background:none; color:var(--trigo-deep); padding:10px 18px; cursor:pointer; }
  .concluir:hover{ background:var(--trigo-soft); }
  .concluir.ok{ background:var(--trigo); border-color:var(--trigo); color:var(--trigo-ink); }
  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; padding-top:18px; border-top:1px solid var(--border); }
  .navrow button{ font-family:var(--mono); font-size:11px; letter-spacing:0.05em; border:1px solid var(--border2); border-radius:8px; background:none; color:var(--ink2); padding:8px 14px; cursor:pointer; }
  .navrow button:hover{ color:var(--ink); border-color:var(--ink3); }

  /* guia */
  .mapa{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:24px 0 6px; }
  .mapa .m{ border:1px solid var(--border); border-radius:11px; background:var(--paper2); padding:14px 15px; }
  .mapa .m .mv{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.12em; color:var(--trigo-deep); }
  .mapa .m .mt{ font-family:var(--serif); font-size:16.5px; font-weight:560; margin:5px 0 3px; }
  .mapa .m .md{ font-size:11.5px; color:var(--ink3); line-height:1.45; }
  .espinha{ border-left:3px solid var(--trigo); background:var(--paper2); border-radius:0 11px 11px 0; padding:15px 19px; margin:22px 0; max-width:62ch; }
  .espinha .el{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink3); display:block; margin-bottom:5px; }
  .espinha p{ font-family:var(--serif); font-size:19px; font-style:italic; color:var(--ink); }

  /* plano de 30 dias */
  .semanas{ display:flex; flex-direction:column; gap:10px; margin:20px 0; max-width:66ch; }
  .semana{ border:1px solid var(--border); border-radius:12px; background:var(--paper2); padding:16px 18px; display:grid; grid-template-columns:auto 1fr; gap:16px; }
  .semana .sn{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.1em; color:var(--trigo-deep); text-transform:uppercase; padding-top:3px; white-space:nowrap; }
  .semana h4{ font-size:14.5px; font-weight:600; margin-bottom:4px; }
  .semana p{ font-size:13px; color:var(--ink2); line-height:1.55; }
  .cklist{ margin:20px 0 6px; max-width:62ch; }
  .cklist .ck{ display:flex; gap:11px; align-items:flex-start; padding:9px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .cklist .ck .box{ width:17px; height:17px; border:1.5px solid var(--border2); border-radius:5px; flex:none; margin-top:2px; display:grid; place-items:center; font-size:11px; color:var(--trigo-ink); background:var(--paper); }
  .cklist .ck.on .box{ background:var(--trigo); border-color:var(--trigo); }
  .cklist .ck.on .box::after{ content:'✓'; font-weight:700; }
  .cklist .ck span{ font-size:13.5px; color:var(--ink2); line-height:1.5; }
  .cklist .ck.on span{ color:var(--ink3); text-decoration:line-through; text-decoration-color:var(--border2); }

  /* cta / rodapé */
  .cta{ border:1px solid var(--trigo-deep); border-radius:13px; background:var(--trigo-soft); padding:22px 24px; margin:34px 0 0; max-width:62ch; }
  .cta .cl{ font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--trigo-ink); display:block; margin-bottom:8px; }
  .cta p{ font-size:13.5px; color:var(--ink); line-height:1.6; margin-bottom:10px; }
  .cta .btn{ display:inline-block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; background:var(--ink); color:var(--paper); border-radius:8px; padding:10px 18px; text-decoration:none; }
  .assin{ font-family:var(--serif); font-size:18px; font-style:italic; color:var(--ink); margin:22px 0 0; }
  .rodape{ margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink3); line-height:1.65; max-width:70ch; }

  button:focus-visible{ outline:2px solid var(--trigo-deep); outline-offset:2px; }

  @media (max-width:900px){
    .app{ grid-template-columns:1fr; }
    .side{ position:relative; height:auto; border-right:none; border-bottom:1px solid var(--border); padding:22px 18px 16px; }
    #nav{ flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px; }
    #nav button{ border-left:none; border:1px solid var(--border); border-radius:8px; white-space:nowrap; grid-template-columns:auto auto; }
    #nav button .mini{ display:none; }
    #nav button.on{ border-color:var(--trigo-deep); }
    .side .prog{ margin-top:12px; }
    .side .foot-note{ display:none; }
    main{ padding:30px 18px 70px; }
    .mapa{ grid-template-columns:1fr 1fr; }
    .duo{ grid-template-columns:1fr; }
    .semana{ grid-template-columns:1fr; gap:6px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <span class="kicker">O Joio do Trigo · curso</span>
    <h1>GEO: como fazer as IAs citarem a <em>sua</em> marca.</h1>
    <div class="by">por Jhon · 8 aulas curtas · uma segunda-feira por aula</div>
    <nav id="nav"></nav>
    <div class="prog">
      <div class="pl"><span>Progresso</span><b id="pcount">0/8</b></div>
      <div class="pbar"><i id="pfill"></i></div>
    </div>
    <div class="foot-note">Rascunho autoral para revisão do Jhon. O progresso vive nesta sessão da página (não fica salvo ao recarregar).</div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* =================== conteúdo =================== */
const ETAPAS = { pan:'panorama', ler:'ler', ent:'entender', conf:'confiar', med:'medir', plano:'plano' };

const GUIA = {
  id:'guia', nav:'Comece por aqui', kicker:'Guia do curso',
  title:'Antes de otimizar, <em>entenda o jogo.</em>',
  html: `
  <div class="lead">
    <p>Olá amigos 👋,</p>
    <p>Eu repito por aqui, sem cansar, que a era da IA está apenas começando. Este curso é sobre um pedaço bem específico desse começo: o momento em que o seu cliente para de digitar no Google — e passa a <b>perguntar</b>. E uma máquina responde por você.</p>
    <p>GEO (Generative Engine Optimization) é o trabalho de fazer sua marca ser lida, entendida e citada por essas máquinas. Não é truque de growth. É mais parecido com reputação: lenta de construir, visível de longe.</p>
  </div>
  <div class="espinha"><span class="el">A tese do curso em uma frase</span><p>Sua marca será descrita por uma IA — com ou sem você.</p></div>
  <div class="body">
    <p>São oito aulas curtas. Cada uma fecha com um <b>freio cético</b> (o que essa tática não faz por você) e uma ação de <b>segunda-feira de manhã</b> — porque estratégia que não cabe na sua segunda não é estratégia, é decoração.</p>
    <h3>O mapa: quatro verbos</h3>
    <p>Tudo o que existe de GEO sério cabe em quatro verbos. A IA só cita quem ela consegue ler, entender e confiar — e você só melhora o que mede.</p>
    <div class="mapa">
      <div class="m"><div class="mv">01 · LER</div><div class="mt">Acesso</div><div class="md">A máquina consegue chegar no seu conteúdo? (aula 4)</div></div>
      <div class="m"><div class="mv">02 · ENTENDER</div><div class="mt">Conteúdo</div><div class="md">O que você publica tem formato de resposta? (aula 5)</div></div>
      <div class="m"><div class="mv">03 · CONFIAR</div><div class="mt">Reputação</div><div class="md">O que os outros dizem sustenta a citação? (aula 6)</div></div>
      <div class="m"><div class="mv">04 · MEDIR</div><div class="mt">Loop</div><div class="md">Você sabe se está funcionando? (aulas 3 e 7)</div></div>
    </div>
    <p style="margin-top:14px">As aulas 1 e 2 são o chão: o que mudou e o que a ciência já mediu. A aula 8 amarra tudo num plano de 30 dias. Siga na ordem na primeira vez; depois volte por aula, como consulta.</p>
    <p class="fonte">Base científica: GEO — Generative Engine Optimization (Aggarwal et al., KDD 2024) · caso de conteúdo: material do próprio autor</p>
  </div>`
};

const AULAS = [
{
  id:'a1', n:'01', etapa:'PANORAMA', nav:'A homepage que você não desenhou',
  title:'A homepage que você <em>não desenhou.</em>',
  html:`
  <div class="lead">
    <p>Pergunte a uma IA o que ela acha da sua marca. Vá lá — eu espero.</p>
    <p>O que voltou é a sua nova homepage. Montada sem briefing, sem aprovação, a partir do que existe publicado sobre você. E é a primeira impressão de um número crescente de clientes.</p>
  </div>
  <div class="body">
    <p>A busca em lista te dava dez chances de clique. A resposta gerada dá <b>uma</b>. Ou nenhuma. Quando alguém pergunta "qual o melhor [o que você vende]?" a um ChatGPT, um Gemini, um Perplexity, a resposta vem pronta: uma recomendação, duas ou três marcas citadas, uma descrição de cada. Quem não está na resposta não perdeu posição — <b>saiu da prateleira</b>.</p>
    <p>Isso já aparece nos números que qualquer dono de site acompanha: o tráfego orgânico de quem vivia de clique vem encolhendo, porque parte das perguntas morre dentro da resposta gerada. A descoberta está mudando de endereço.</p>
    <p><b>GEO em uma frase:</b> o conjunto de práticas para sua marca ser citada, bem descrita e recomendada dentro das respostas geradas por IA. O resto do curso são os quatro verbos: fazer a máquina <b>ler</b> você, <b>entender</b> você, <b>confiar</b> em você — e você <b>medir</b> tudo isso.</p>
  </div>
  <div class="freio"><span class="fl">Freio cético</span><p>O Google não morreu, e o volume da busca tradicional ainda é gigante. SEO segue pagando boletos — GEO não substitui, disputa a camada nova, onde a decisão começa a se formar. Quem abandona um pelo outro erra duas vezes.</p></div>
  <div class="segunda"><span class="sl">Na segunda de manhã</span><p>Pergunte a <b>duas IAs</b>: "o que você acha de [sua marca]?" e "quais as melhores opções de [sua categoria]?". Guarde os prints com data.<span class="metr">métrica: existir um registro do "antes" — você vai precisar dele na aula 7</span></p></div>
  <p class="fonte">Conceito e enquadramento: paper GEO §1 · observação de mercado do autor</p>`
},
{
  id:'a2', n:'02', etapa:'PANORAMA', nav:'O joio e o trigo da evidência',
  title:'O que a ciência mediu (e o que é <em>só palpite</em>).',
  html:`
  <div class="lead">
    <p>Todo mundo tem palpite sobre "aparecer no ChatGPT". Palpite é barato. Medição é rara.</p>
    <p>Em 2024, pesquisadores de Princeton, IIT Delhi, Georgia Tech e Allen AI resolveram medir — no paper que criou o termo GEO, publicado no KDD: 9 táticas, 10 mil consultas, respostas geradas de verdade.</p>
  </div>
  <div class="body">
    <p>Vamos separar o Joio do Trigo?</p>
    <div class="duo">
      <div class="col win"><span class="tag">O trigo — melhora a visibilidade</span><ul>
        <li><b>Aspas de fontes</b> (citação direta de quem sabe): <b>+41%</b> — a tática campeã</li>
        <li><b>Estatísticas</b> com origem: <b>+31%</b></li>
        <li><b>Referências citáveis</b>: <b>+27%</b></li>
        <li>Fluência + dados <b>combinados</b> superam qualquer tática isolada</li>
      </ul></div>
      <div class="col lose"><span class="tag">O joio — não funciona</span><ul>
        <li><b>Keyword stuffing</b> — repetir palavra-chave — <b>piora</b> o resultado (−8%)</li>
        <li>Otimização genérica igual para todo domínio (o efeito varia por assunto)</li>
        <li>Confiar que a posição no Google se transfere sozinha para a resposta</li>
      </ul></div>
    </div>

    '<div class="navrow">' +
      '<button data-go="prev">← anterior</button>' +
      '<button data-go="next">' + (item.id === 'a8' ? 'voltar ao guia' : 'próxima →') + '</button>' +
    '</div>';
  main.appendChild(sec);

  if (isAula) {
    const quizWrap = sec.querySelector('[data-quiz="' + item.id + '"]');
    const qs = QUIZ.filter(q => q.a === item.id);
    let qDone = 0, qRight = 0;
    qs.forEach(qz => {
      const qq = document.createElement('div');
      qq.className = 'qq';
      qq.innerHTML = '<p class="qt">' + qz.q + '</p>';
      qz.opts.forEach((opt, oi) => {
        const ob = document.createElement('button');
        ob.className = 'opt'; ob.textContent = opt;
        ob.addEventListener('click', () => {
          if (qq.classList.contains('answered')) return;
          qq.classList.add('answered');
          qq.querySelectorAll('.opt').forEach((o2, o2i) => {
            if (o2i === qz.c) o2.classList.add('correct');
            else if (o2i === oi) o2.classList.add('wrong');
          });
          qDone++; if (oi === qz.c) qRight++;
          quizWrap.querySelector('[data-qscore="' + item.id + '"]').textContent = qRight + '/' + qs.length + ' certas';
        });
        qq.appendChild(ob);
      });
      const why = document.createElement('div');
      why.className = 'why';
      why.innerHTML = '<b>Por quê</b>' + qz.why;
      qq.appendChild(why);
      quizWrap.appendChild(qq);
    });

    sec.querySelector('[data-conc="' + item.id + '"]').addEventListener('click', e => {
      const btn = e.currentTarget;
      if (done.has(item.id)) { done.delete(item.id); btn.classList.remove('ok'); btn.textContent = 'marcar aula como concluída'; }
      else { done.add(item.id); btn.classList.add('ok'); btn.textContent = '✓ aula concluída'; }
      updateProgress();
    });
  }

  sec.querySelectorAll('[data-go]').forEach(gb => gb.addEventListener('click', () => {
    const idx = ALL.findIndex(x => x.id === current);
    if (gb.dataset.go === 'prev') show(ALL[Math.max(0, idx - 1)].id);
    else show(ALL[(idx + 1) % ALL.length].id);
  }));
});

function show(id){
  current = id;
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.s === id));
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function updateProgress(){
  document.getElementById('pcount').textContent = done.size + '/8';
  document.getElementById('pfill').style.width = (done.size / 8 * 100) + '%';
  document.querySelectorAll('#nav button').forEach(b => {
    const isDone = done.has(b.dataset.s);
    b.classList.toggle('done', isDone);
    const mini = b.querySelector('[data-mini]');
    if (mini) mini.textContent = isDone ? '✓' : '';
  });
}

const ck = document.getElementById('cklist');
if (ck) ck.querySelectorAll('.ck').forEach(row => row.addEventListener('click', () => row.classList.toggle('on')));

show('guia');
updateProgress();
</script>
</body>
</html>
