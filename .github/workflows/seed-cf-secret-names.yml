# Seed ÚNICO: cadastra os NOMES dos segredos no worker ultravis-server com
# valor placeholder "PREENCHER", pro dono só editar e colar o valor real no
# painel (Workers → ultravis-server → Configurações → Variáveis e segredos).
# Nunca sobrescreve um nome que já exista. Roda uma vez, no merge deste
# arquivo; depois fica inerte (só re-roda se o arquivo mudar).
name: seed-cf-secret-names

on:
  push:
    branches: [main]
    paths: ['.github/workflows/seed-cf-secret-names.yml']

# Achado P2 da auditoria de 08/set: job só chama a API da Cloudflare (token
# próprio, não GITHUB_TOKEN) — não precisa de nada além de checkout.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: '749b2e9b3642e4b03321d5830e81c195'
      SCRIPT: 'ultravis-server'
    steps:
      - name: Cadastrar nomes (placeholder, sem sobrescrever existentes)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1
          fi
          existing=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print("\n".join(s["name"] for s in (d.get("result") or [])))')
          echo "já existentes: ${existing:-nenhum}"
          created=0; kept=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY \
                      CLORO_API_KEY CLORO_WEBHOOK_SECRET CRON_SECRET \
                      ANTHROPIC_API_KEY OPENAI_API_KEY \
                      GOOGLE_GENERATIVE_AI_API_KEY SCRAPEDO_API_KEY; do
            if echo "$existing" | grep -qx "$name"; then
              echo "= $name já existe — mantido"; kept=$((kept+1)); continue
            fi
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$name\",\"text\":\"PREENCHER\",\"type\":\"secret_text\"}" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print("ok" if d.get("success") else json.dumps(d)[:300])'
            echo "+ $name cadastrado (PREENCHER)"; created=$((created+1))
          done
          echo "### Seed: $created cadastrado(s), $kept mantido(s) — editar valores no painel do worker $SCRIPT" >> "$GITHUB_STEP_SUMMARY"
