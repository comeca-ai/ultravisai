# Cria contato@ultravis.ai via Email Routing da Cloudflare (grátis) —
# canal LGPD referenciado nas páginas de Termos/Privacidade
# (pendência nº 3 do STATUS.md).
#
# ⚠️ AÇÃO DESTRUTIVA GUARDADA: este job APAGA os MX atuais da zona.
#
# Como chegamos aqui (5 runs, 08/set): os runs #1-#3 morreram em
# "Authentication error [10000]" genérico; o preflight do #3 fechou que
# faltava só `Zone → DNS: Edit`. Com o token corrigido, o #4 mudou o erro
# para "2008 Non-Cloudflare MX records exist" e o #5 imprimiu a causa:
# a zona tem MX mx1/mx2.hostinger.com — habilitar Email Routing exige
# substituí-los. **Dono confirmou em 08/set que NÃO há caixa de e-mail
# em uso no @ultravis.ai**, então remover é seguro e intencional.
#
# Ordem defensiva (mesmo espírito do cutover-api-dns.yml):
# (1) preflight de permissões; (2) lê e IMPRIME os MX atuais — essa
# impressão É a receita de rollback; (3) só com ARMADO='sim', apaga os
# MX não-Cloudflare; (4) habilita Email Routing (a Cloudflare cria os MX
# dela); (5) garante o destino verificado; (6) cria a regra
# contato@ultravis.ai → destino; (7) imprime o estado final.
#
# ROLLBACK: recriar os MX impressos no passo 2 (tipo MX, nome
# ultravis.ai, conteúdo e prioridade exatos do log) e desabilitar o
# Email Routing no painel.
#
# Convenção do repo pra destrutivo (ver limpar-workers-orfaos.yml): só
# roda com acionamento explícito e com a linha ARMADO em 'sim'.
name: criar-email-contato

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'E-mail de destino do forward (padrão: jhonata.emerick@gmail.com)'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/criar-email-contato.yml']

permissions:
  contents: read

jobs:
  criar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: '749b2e9b3642e4b03321d5830e81c195'
      ZONE: 'ultravis.ai'
      ENDERECO: 'contato@ultravis.ai'
      DESTINO: ${{ inputs.destino || 'jhonata.emerick@gmail.com' }}
      # GUARD da remoção dos MX. 'sim' = pode apagar; qualquer outro
      # valor = só imprime o que faria e segue. Armado em 08/set com
      # confirmação explícita do dono de que não há e-mail em uso no
      # domínio. Se um dia voltar a existir caixa em @ultravis.ai,
      # voltar isto pra 'nao' ANTES de qualquer re-run.
      ARMADO: 'sim'
    steps:
      # Sonda CADA permissão que os passos abaixo precisam e imprime qual
      # falta — antes de tentar mutação nenhuma. Existe porque os runs #1 e #2
      # morreram os dois em "Authentication error [10000]" genérico, que não
      # diz QUAL escopo falta: gastamos duas rodadas formulando hipótese
      # quando o próprio job podia ter respondido. Nada aqui altera estado:
      # as sondas de escrita usam alvo inexistente (a API checa permissão
      # ANTES de existência, então 10000 = sem permissão e "not found" = tem).
      - name: Preflight — o que este token pode de verdade
        continue-on-error: true
        run: |
          CF="https://api.cloudflare.com/client/v4"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::sem CLOUDFLARE_API_TOKEN"; exit 1; }

          veredito() { # <arquivo json> <rotulo>
            python3 - "$1" "$2" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              print("%-38s INDETERMINADO (resposta nao-JSON)" % sys.argv[2]); raise SystemExit
          if d.get("success"):
              print("%-38s SIM" % sys.argv[2]); raise SystemExit
          erros = d.get("errors") or []
          cods = [e.get("code") for e in erros]
          msgs = "; ".join(str(e.get("message")) for e in erros)
          if 10000 in cods or "authentication error" in msgs.lower():
              print("%-38s NAO — falta permissao (%s)" % (sys.argv[2], msgs))
          elif any("not found" in str(e.get("message", "")).lower() for e in erros):
              print("%-38s SIM (permissao ok; alvo inexistente)" % sys.argv[2])
          else:
              print("%-38s ? %s %s" % (sys.argv[2], cods, msgs))
          PY
          }

          curl -sS -H "$H" "$CF/zones?name=$ZONE" > /tmp/p_zone.json
          ZID=$(python3 -c 'import json;r=json.load(open("/tmp/p_zone.json")).get("result") or [];print(r[0]["id"] if r else "")')

          echo "== LEITURA =="
          veredito /tmp/p_zone.json "Zone: Read"
          if [ -n "$ZID" ]; then
            curl -sS -H "$H" "$CF/zones/$ZID/email/routing" > /tmp/p_er.json
            veredito /tmp/p_er.json "Email Routing Rules: Read"
            curl -sS -H "$H" "$CF/zones/$ZID/dns_records?per_page=1" > /tmp/p_dns.json
            veredito /tmp/p_dns.json "DNS: Read"
          fi
          curl -sS -H "$H" "$CF/accounts/$ACC/email/routing/addresses" > /tmp/p_addr.json
          veredito /tmp/p_addr.json "Email Routing Addresses: Read"

          echo "== ESCRITA (alvo inexistente — nao altera nada) =="
          if [ -n "$ZID" ]; then
            curl -sS -X DELETE -H "$H" \
              "$CF/zones/$ZID/dns_records/00000000000000000000000000000000" > /tmp/p_dnsw.json
            veredito /tmp/p_dnsw.json "DNS: Edit"
            curl -sS -X DELETE -H "$H" \
              "$CF/zones/$ZID/email/routing/rules/00000000000000000000000000000000" > /tmp/p_erw.json
            veredito /tmp/p_erw.json "Email Routing Rules: Edit"
          fi
          curl -sS -X DELETE -H "$H" \
            "$CF/accounts/$ACC/email/routing/addresses/00000000000000000000000000000000" > /tmp/p_addrw.json
          veredito /tmp/p_addrw.json "Email Routing Addresses: Edit"

          echo ""
          echo "Se alguma linha de ESCRITA disser NAO, é essa a permissão que falta no token."

      - name: Habilitar Email Routing + criar endereço e regra
        run: |
          CF="https://api.cloudflare.com/client/v4"
          j() { python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin),indent=1)[:900])'; }
          okof() { python3 -c 'import json,sys;print(1 if json.load(sys.stdin).get("success") else 0)'; }
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::sem CLOUDFLARE_API_TOKEN"; exit 1; }

          echo "== 1. zona =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/zones?name=$ZONE" > /tmp/zone.json
          j < /tmp/zone.json
          ZID=$(python3 -c 'import json;r=json.load(open("/tmp/zone.json")).get("result") or [];print(r[0]["id"] if r else "")')
          [ -z "$ZID" ] && { echo "::error::token não enxerga a zona $ZONE (falta Zone:Read) — nada foi alterado"; exit 1; }

          echo "== 1b. MX atuais da zona — ESTA IMPRESSAO E O ROLLBACK =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones/$ZID/dns_records?type=MX" > /tmp/mx.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/mx.json"))
          regs = d.get("result") or []
          if not regs:
              print("nenhum MX na zona — nada a remover")
          else:
              print("%d registro(s) MX existentes:" % len(regs))
              for r in regs:
                  print("  prio %-4s %-45s ttl %-6s name %s (id %s)" % (
                      r.get("priority"), r.get("content"), r.get("ttl"),
                      r.get("name"), r.get("id")))
              print("")
              print("ROLLBACK: recriar exatamente os registros acima (tipo MX) e")
              print("desabilitar o Email Routing no painel.")
          # ids num arquivo separado, um por linha, pro passo de remocao
          open("/tmp/mx_ids.txt", "w").write(
              "".join("%s %s\n" % (r.get("id"), r.get("content")) for r in regs))
          PY

          echo "== 1c. remover MX nao-Cloudflare (ARMADO=$ARMADO) =="
          if [ ! -s /tmp/mx_ids.txt ]; then
            echo "(sem MX pra remover — seguindo)"
          elif [ "$ARMADO" != "sim" ]; then
            echo "::warning::ARMADO != 'sim' — os MX acima NAO foram tocados. O passo 2 vai falhar em 2008; é o esperado com o guard fechado."
          else
            while read -r ID CONTEUDO; do
              [ -z "$ID" ] && continue
              echo "-- apagando MX $CONTEUDO ($ID)"
              curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$CF/zones/$ZID/dns_records/$ID" > /tmp/del.json
              if [ "$(okof < /tmp/del.json)" != "1" ]; then
                j < /tmp/del.json
                echo "::error::falha ao apagar o MX $CONTEUDO — ver JSON acima. ROLLBACK: os registros estao impressos no passo 1b."
                exit 1
              fi
            done < /tmp/mx_ids.txt
            echo "MX removidos."
          fi

          echo "== 1d. SPF órfão da Hostinger — ESTA IMPRESSAO E O ROLLBACK =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones/$ZID/dns_records?type=TXT" > /tmp/txt.json
          # SELETIVO de propósito: só TXT que é SPF *e* cita hostinger. TXT de
          # verificação de domínio e DKIM ficam intactos — apagar TXT em bloco
          # aqui derrubaria coisa sem relação nenhuma com e-mail.
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/txt.json"))
          regs = d.get("result") or []
          print("%d registro(s) TXT na zona (todos, pra rollback):" % len(regs))
          alvos = []
          for r in regs:
              c = (r.get("content") or "")
              marca = ""
              if "v=spf1" in c.lower() and "hostinger" in c.lower():
                  alvos.append(r)
                  marca = "   <-- ALVO (SPF da Hostinger)"
              print("  %-58s ttl %-6s (id %s)%s" % (
                  c[:58], r.get("ttl"), r.get("id"), marca))
          print("")
          print("ROLLBACK: recriar os TXT marcados como ALVO com o conteudo exato acima.")
          open("/tmp/spf_ids.txt", "w").write(
              "".join("%s\n" % r.get("id") for r in alvos))
          # sobra algum SPF depois da limpeza?
          resta = [r for r in regs
                   if "v=spf1" in (r.get("content") or "").lower() and r not in alvos]
          open("/tmp/spf_resta.txt", "w").write("1" if resta else "0")
          PY

          if [ ! -s /tmp/spf_ids.txt ]; then
            echo "(nenhum SPF da Hostinger — nada a limpar)"
          elif [ "$ARMADO" != "sim" ]; then
            echo "::warning::ARMADO != 'sim' — SPF órfão NAO removido."
          else
            while read -r ID; do
              [ -z "$ID" ] && continue
              echo "-- apagando TXT SPF da Hostinger ($ID)"
              curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$CF/zones/$ZID/dns_records/$ID" > /tmp/deltxt.json
              if [ "$(okof < /tmp/deltxt.json)" != "1" ]; then
                j < /tmp/deltxt.json
                echo "::error::falha ao apagar o TXT SPF — ROLLBACK no passo 1d."
                exit 1
              fi
            done < /tmp/spf_ids.txt
            # Sem NENHUM SPF a Cloudflare segue reclamando; publica o dela.
            if [ "$(cat /tmp/spf_resta.txt)" = "0" ]; then
              echo "-- publicando o SPF da Cloudflare (nenhum outro SPF restou)"
              curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" "$CF/zones/$ZID/dns_records" \
                --data "{\"type\":\"TXT\",\"name\":\"$ZONE\",\"content\":\"v=spf1 include:_spf.mx.cloudflare.net ~all\",\"ttl\":1}" > /tmp/spfnovo.json
              j < /tmp/spfnovo.json
              if [ "$(okof < /tmp/spfnovo.json)" != "1" ]; then
                echo "::warning::não deu pra publicar o SPF da Cloudflare — conferir no painel (Email → Routing → DNS)."
              fi
            else
              echo "(já existe outro SPF na zona — não vou publicar um segundo; conferir manualmente)"
            fi
          fi

          echo "== 2. habilitar Email Routing (idempotente) =="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones/$ZID/email/routing/enable" > /tmp/enable.json
          j < /tmp/enable.json
          if [ "$(okof < /tmp/enable.json)" != "1" ]; then
            # Distingue os 3 desfechos possíveis; antes qualquer falha era
            # reportada como "falta permissão", o que passou a mentir assim
            # que a permissão foi corrigida (run #4 morreu em 2008 e a
            # mensagem culpou o token).
            CASO=$(python3 -c '
          import json
          d = json.load(open("/tmp/enable.json"))
          erros = d.get("errors") or []
          cods = [e.get("code") for e in erros]
          msgs = " ".join(str(e.get("message","")).lower() for e in erros)
          if 2008 in cods or "mx records exist" in msgs:
              print("mx")
          elif "already" in msgs or "enabled" in msgs:
              print("ja")
          elif 10000 in cods or "authentication" in msgs:
              print("perm")
          else:
              print("outro")
          ')
            case "$CASO" in
              ja)
                echo "(já estava habilitado — seguindo)" ;;
              mx)
                if [ "$ARMADO" = "sim" ]; then
                  echo "::error::Ainda há MX não-Cloudflare na zona depois do passo 1c (code 2008). A remoção não pegou tudo — conferir a lista do passo 1b e o resultado do 1c acima. Nenhum e-mail foi redirecionado; a zona está no estado que o 1c deixou."
                else
                  echo "::error::A zona tem MX apontando pra fora da Cloudflare (code 2008) e o guard ARMADO não está em 'sim', então nada foi removido. Ver a lista no passo 1b: habilitar Email Routing substituiria esses registros. Só armar depois de confirmar que nenhum e-mail @ultravis.ai está em uso."
                fi
                exit 1 ;;
              perm)
                echo "::error::Token sem permissão pra habilitar Email Routing — ver o passo de preflight acima, que diz qual escopo deu NAO."
                exit 1 ;;
              *)
                echo "::error::Email Routing não habilitou por um motivo não mapeado — JSON acima."
                exit 1 ;;
            esac
          fi

          echo "== 3. endereços de destino já verificados =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/accounts/$ACC/email/routing/addresses" > /tmp/enderecos.json
          j < /tmp/enderecos.json
          JA_EXISTE=$(python3 -c "
          import json
          d = json.load(open('/tmp/enderecos.json'))
          alvo = '$DESTINO'.lower()
          for e in (d.get('result') or []):
              if e.get('email','').lower() == alvo:
                  print('verificado' if e.get('verified') else 'pendente')
                  break
          else:
              print('ausente')
          ")
          echo "destino '$DESTINO': $JA_EXISTE"

          if [ "$JA_EXISTE" = "ausente" ]; then
            echo "== 3b. criando destino (dispara e-mail de verificação da Cloudflare) =="
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "$CF/accounts/$ACC/email/routing/addresses" \
              --data "{\"email\":\"$DESTINO\"}" > /tmp/criar_dest.json
            j < /tmp/criar_dest.json
            echo "::warning::destino '$DESTINO' criado mas AINDA NÃO VERIFICADO — clique no link que a Cloudflare mandou pra essa caixa antes que o forward funcione de verdade."
          fi

          echo "== 4. criar/atualizar a regra $ENDERECO → $DESTINO =="
          NOME_REGRA="contato para $DESTINO"
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "$CF/zones/$ZID/email/routing/rules" \
            --data "{\"matchers\":[{\"type\":\"literal\",\"field\":\"to\",\"value\":\"$ENDERECO\"}],\"actions\":[{\"type\":\"forward\",\"value\":[\"$DESTINO\"]}],\"enabled\":true,\"name\":\"$NOME_REGRA\"}" > /tmp/regra.json
          j < /tmp/regra.json
          if [ "$(okof < /tmp/regra.json)" != "1" ]; then
            JA_EXISTE_REGRA=$(python3 -c 'import json;d=json.load(open("/tmp/regra.json"));print(1 if any("already" in str(e.get("message","")).lower() or "exist" in str(e.get("message","")).lower() for e in d.get("errors",[])) else 0)')
            if [ "$JA_EXISTE_REGRA" != "1" ]; then
              echo "::error::criação da regra falhou — JSON acima."
              exit 1
            fi
            echo "(regra já existia — seguindo)"
          fi

          # Catch-all: qualquer endereço @ultravis.ai que não bata numa regra
          # específica cai no destino, em vez de bounce. Endpoint próprio
          # (PUT .../rules/catch_all), não é uma regra da lista normal.
          echo "== 4b. catch-all → $DESTINO =="
          curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$CF/zones/$ZID/email/routing/rules/catch_all" \
            --data "{\"matchers\":[{\"type\":\"all\"}],\"actions\":[{\"type\":\"forward\",\"value\":[\"$DESTINO\"]}],\"enabled\":true,\"name\":\"catch-all para $DESTINO\"}" > /tmp/catchall.json
          j < /tmp/catchall.json
          if [ "$(okof < /tmp/catchall.json)" != "1" ]; then
            echo "::warning::catch-all não configurado — as regras específicas seguem valendo; conferir no painel."
          fi

          echo "== 5. estado final das regras =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF/zones/$ZID/email/routing/rules" | j

          {
            echo "### Email Routing — $ENDERECO → $DESTINO"
            echo "Destino '$DESTINO': **$JA_EXISTE**"
            if [ "$JA_EXISTE" = "ausente" ]; then
              echo ""
              echo "⚠️ Falta clicar no e-mail de verificação da Cloudflare em **$DESTINO** — sem isso o forward não entrega."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
