# Propaga segredos do GitHub → Cloudflare Worker (wrangler secret put).
#
# Fonte única: GitHub → Settings → Secrets and variables → Actions.
# Rotação: atualizar o valor lá e re-rodar este workflow — nada passa por
# chat/commit (regra da casa). Segredo ausente no GitHub é pulado com aviso,
# então dá pra popular aos poucos, fase a fase da migração (ADR Cloudflare).
#
# Pré-requisito: o worker já deployado uma vez (deploy-edge-gateway).
name: sync-cf-secrets

on:
  workflow_dispatch:
    inputs:
      worker_dir:
        description: 'Pasta do worker que recebe os segredos'
        required: false
        default: 'cloudflare/edge-gateway'
        type: string
      cf_api_token:
        description: 'PROVISÓRIO: token da API Cloudflare só para este run (prefira o secret CLOUDFLARE_API_TOKEN)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Fase 2+ — consumer da fila grava no Supabase e fala com provedores.
      S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      S_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      S_CLORO_API_KEY: ${{ secrets.CLORO_API_KEY }}
      S_CLORO_WEBHOOK_SECRET: ${{ secrets.CLORO_WEBHOOK_SECRET }}
      S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      S_GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      S_SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
      S_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      S_CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Mascarar token provisório
        if: ${{ inputs.cf_api_token != '' }}
        run: echo "::add-mask::${{ inputs.cf_api_token }}"
      - name: Propagar segredos para o worker (API REST — sem wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.cf_api_token || secrets.CLOUDFLARE_API_TOKEN }}
          ACC: '749b2e9b3642e4b03321d5830e81c195'
          WORKER_DIR: ${{ inputs.worker_dir || 'cloudflare/edge-gateway' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::sem token — informe o input cf_api_token ou crie o secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          # nome do script sai do wrangler.jsonc da pasta
          SCRIPT=$(python3 - <<PY
          import json,re
          s=open("$WORKER_DIR/wrangler.jsonc").read()
          s=re.sub(r'//[^\n]*','',s)
          print(json.loads(s)["name"])
          PY
          )
          echo "worker alvo: $SCRIPT"
          put() {
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$SCRIPT/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$(python3 -c 'import json,sys;print(json.dumps({"name":sys.argv[1],"text":sys.argv[2],"type":"secret_text"}))' "$1" "$2")" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print("ok" if d.get("success") else json.dumps(d)[:300]);sys.exit(0 if d.get("success") else 1)'
          }
          ok=0; skip=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY \
                      CLORO_API_KEY CLORO_WEBHOOK_SECRET CRON_SECRET \
                      ANTHROPIC_API_KEY OPENAI_API_KEY \
                      GOOGLE_GENERATIVE_AI_API_KEY SCRAPEDO_API_KEY; do
            key="S_$name"
            value="${!key}"
            if [ -n "$value" ]; then
              put "$name" "$value"
              echo "✓ $name propagado"
              ok=$((ok+1))
            else
              echo "– $name ausente no GitHub — pulado"
              skip=$((skip+1))
            fi
          done
          echo "### Resultado: $ok propagado(s), $skip pulado(s)" >> "$GITHUB_STEP_SUMMARY"
