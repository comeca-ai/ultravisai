# Deploy do espelho D1 (experimento — produção intocada) — ver
# cloudflare/d1-espelho/README.md.
#
# Clonado do padrão deploy-server-container: wrangler 4.129.0 via GitHub
# Actions (sandbox não alcança api.cloudflare.com), erros sempre nomeando o
# remédio (lição da skill cloudflare).
#
# Requisitos (uma vez):
#   1. Banco D1 "ultravis-espelho" criado no painel e database_id preenchido
#      em cloudflare/d1-espelho/wrangler.jsonc (o guard abaixo cobra).
#   2. Secret CLOUDFLARE_API_TOKEN com token do template "Edit Cloudflare
#      Workers" + permissão de conta "D1:Edit" (wrangler d1 execute escreve).
name: deploy-d1-espelho

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/d1-espelho/**'
      - '.github/workflows/deploy-d1-espelho.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/d1-espelho
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credencial
        id: cred
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOK" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; else
            echo "has=0" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN ausente — deploy pulado"
          fi

      - name: Guard — database_id preenchido?
        if: steps.cred.outputs.has == '1'
        run: |
          if grep -q 'PREENCHER_NO_PAINEL' wrangler.jsonc; then
            echo "::error::database_id ainda é o placeholder — passo do dono: criar o banco D1 'ultravis-espelho' no painel (Storage & Databases → D1 → Create) e colar o Database ID em cloudflare/d1-espelho/wrangler.jsonc."
            echo "## Deploy bloqueado: falta o database_id do banco D1 (criar 'ultravis-espelho' no painel)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Aplicar schema (wrangler d1 execute --remote)
        if: steps.cred.outputs.has == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '749b2e9b3642e4b03321d5830e81c195'
        run: |
          npx wrangler@4.129.0 d1 execute ultravis-espelho --remote --file=schema.d1.sql -y 2>&1 | tee /tmp/d1.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "## Aplicação do schema falhou — leia o motivo acima." >> "$GITHUB_STEP_SUMMARY"
            if grep -qiE "authentication|authorization|10000|7403|not authorized|permission" /tmp/d1.log; then
              echo "::error::token precisa de D1:Edit — editar o token no painel (My Profile → API Tokens) adicionando a permissão de conta 'D1:Edit'; o valor do token não muda, o secret no GitHub não precisa ser trocado."
            fi
            if grep -qiE "couldn't find|not found|no (d1 )?database" /tmp/d1.log; then
              echo "::error::banco 'ultravis-espelho' não existe na conta — criar no painel (Storage & Databases → D1) e conferir o database_id no wrangler.jsonc."
            fi
            if grep -qi "membership" /tmp/d1.log; then
              echo "::error::wrangler exige token do template 'Edit Cloudflare Workers' (User→Memberships→Read). Recrie o token pelo template e atualize o secret."
            fi
            exit "$rc"
          fi
          echo "### Schema aplicado no banco ultravis-espelho (37 tabelas, idempotente)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy do worker de visualização
        if: steps.cred.outputs.has == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '749b2e9b3642e4b03321d5830e81c195'
        run: |
          npx wrangler@4.129.0 deploy 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "## Deploy falhou — leia o motivo acima." >> "$GITHUB_STEP_SUMMARY"
            if grep -qi "membership" /tmp/deploy.log; then
              echo "::error::wrangler exige token do template 'Edit Cloudflare Workers' (User→Memberships→Read). Recrie o token pelo template e atualize o secret."
            fi
            exit "$rc"
          fi
          echo "### Worker ultravis-d1-espelho publicado" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (GET / lista tabelas e contagens)
        if: steps.cred.outputs.has == '1'
        run: |
          URL="https://ultravis-d1-espelho.jhonata-emerick.workers.dev/"
          for i in 1 2 3 4 5; do
            sleep 10
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$URL" || echo 000)
            echo "tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 400 /tmp/body; echo
              echo "### Smoke test OK ($URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          head -c 400 /tmp/body 2>/dev/null; echo
          echo "::warning::smoke não passou (HTTP $code) — worker publicado; corpo acima"
          echo "### Smoke: HTTP $code — ver corpo no log" >> "$GITHUB_STEP_SUMMARY"
          exit 0
