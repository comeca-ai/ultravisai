name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema:
    name: schema — consolidated schema.sql is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate schema.sql from migrations
        run: bash supabase/build-schema.sh
      - name: Fail if schema.sql is out of date
        run: |
          if ! git diff --quiet -- supabase/schema.sql; then
            echo "::error::supabase/schema.sql is out of date. Run 'bash supabase/build-schema.sh' and commit the result."
            git --no-pager diff -- supabase/schema.sql
            exit 1
          fi

  # O código dos workers não passava por NENHUMA validação no CI. Antes isso
  # arriscava um experimento; desde 06/set o worker serve api.ultravis.ai, então
  # um erro de parse aqui derruba a aplicação do cliente. Checagem barata
  # (segundos) que teria pego o comentário com "*/" que quebrou o run #2.
  cloudflare:
    name: cloudflare — sintaxe dos workers e config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check em cada worker
        run: |
          falhas=0
          for f in $(find cloudflare -name '*.js' -path '*/src/*' -not -path '*/node_modules/*'); do
            if node --input-type=module --check < "$f"; then
              echo "ok  $f"
            else
              echo "::error file=$f::erro de sintaxe no worker"
              falhas=$((falhas+1))
            fi
          done
          [ "$falhas" -eq 0 ] || exit 1
      # O run #22 do deploy morreu com IndentationError num parser embutido
      # como heredoc no workflow: script de CI não passava por validação
      # nenhuma. Agora passa — e o parser virou arquivo (.github/scripts/),
      # que é o que torna esta checagem possível.
      - name: scripts de CI compilam (py_compile)
        run: |
          falhas=0
          for f in $(find .github/scripts -name '*.py' 2>/dev/null); do
            if python3 -m py_compile "$f"; then
              echo "ok  $f"
            else
              echo "::error file=$f::erro de sintaxe no script de CI"
              falhas=$((falhas+1))
            fi
          done
          [ "$falhas" -eq 0 ] || exit 1
      - name: wrangler.jsonc parseável (JSONC → JSON)
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          def strip_jsonc(s):
              # remove // fora de string (o parser ingênuo cortava no "https://")
              out, i, dentro, esc = [], 0, False, False
              while i < len(s):
                  c = s[i]
                  if dentro:
                      out.append(c)
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': dentro = False
                      i += 1
                  elif c == '"':
                      dentro = True; out.append(c); i += 1
                  elif c == '/' and i + 1 < len(s) and s[i+1] == '/':
                      while i < len(s) and s[i] != '\n': i += 1
                  else:
                      out.append(c); i += 1
              return ''.join(out)
          erros = 0
          for p in pathlib.Path('cloudflare').rglob('wrangler.jsonc'):
              try:
                  d = json.loads(strip_jsonc(p.read_text()))
                  print(f'ok  {p} -> {d["name"]}')
              except Exception as e:
                  print(f'::error file={p}::wrangler.jsonc inválido: {e}')
                  erros += 1
          sys.exit(1 if erros else 0)
          PY

  web:
    name: web — format, lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Prettier format check
        run: yarn format:check
      - name: ESLint
        run: yarn lint
      - name: TypeScript typecheck
        run: yarn typecheck
      - name: Vitest tests
        run: yarn test
  server:
    name: server — lint, format & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Vitest tests
        run: npm run test
